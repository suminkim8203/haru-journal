/* Preserve the two original type directions; this is not a new visual-brand decision. */
:root{--ui:Pretendard,"Batang","Noto Serif CJK KR",serif}

.timeblock.short{font-size:0}.timeblock.short b{line-height:1.15}

/* 02.1: scheduling feedback, shared date selector and direct 24-hour input. */
.placement-status{display:block;margin-top:6px;font-family:var(--ui);font-size:11px;line-height:1.6}
.placement-status.scheduled{color:#515151}.placement-status.pending{color:var(--muted)}
.work .placement-status{font-size:12px;margin-top:9px}
.all-placed{padding:13px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);margin-top:17px}
.date-value{width:100%;min-height:45px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:1px solid #a9a9a9;border-radius:3px;text-align:left;font-size:14px;color:var(--muted)}

.clock-inputs{display:flex;align-items:center;gap:8px}

.inline-schedule{border:1px solid var(--line);border-radius:3px;background:var(--paper)}
.schedule-toggle{padding:15px;display:flex;align-items:flex-start;gap:11px;cursor:pointer}
.schedule-toggle input{margin-top:4px}.schedule-toggle strong{display:block;font-size:14px;font-weight:600}.schedule-toggle small{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.schedule-help{padding:0 15px 14px}
.inline-schedule.is-open .schedule-toggle{border-bottom:1px solid var(--line);background:var(--accent-soft)}
#new-task-placement{padding:17px 15px 15px;display:grid;gap:14px}

.date-picker-shortcuts .link{margin-left:auto}.date-direct{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.date-direct>label{font-size:12px;display:block;margin-bottom:5px}.date-direct input{flex:1;width:0;min-width:0;font-size:14px;padding:8px 9px}.date-direct .row{flex-wrap:nowrap;gap:7px}
.date-direct>.tiny{display:block;margin-top:7px}.date-dialog .error{margin:12px 0 0}

 .field input:not([type=checkbox]),.field textarea{font-size:16px}

 .date-dialog-head .iconbtn,.date-calendar-nav .iconbtn{min-height:41px;min-width:41px}

 .form-actions>.btn.primary{flex:1}
 .schedule-toggle{padding:13px 11px}#new-task-placement{padding:14px 11px}

}

/* 02.2: proportional blocks, readable density, aligned scroll header, restrained date marker. */
.timeline-scroll{--axis-width:52px;scroll-padding-top:38px}
.timeline-labels,.timeline{grid-template-columns:var(--axis-width) minmax(0,1fr) minmax(0,1fr)}
.timeline-labels{position:sticky;top:0;z-index:6;min-height:34px;line-height:34px;border:0;border-bottom:1px solid var(--line-dark);background:var(--wash)}
.timeline-labels>div{min-width:0;box-sizing:border-box}
.timeblock{display:block;padding:6px 7px;min-height:0;overflow:hidden;line-height:16px;isolation:isolate;contain:paint}
.timeblock .block-heading{display:flex;align-items:center;gap:5px;min-width:0;width:100%;height:17px;line-height:17px;overflow:hidden}
.timeblock .block-heading b{display:block;flex:1;min-width:0;line-height:17px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-priority{display:inline-block;flex:none;font-family:var(--ui);font-size:10px;line-height:15px;white-space:nowrap;padding:0 4px;border:1px solid #b1b1b1;border-radius:2px;color:#484848;background:var(--paper)}
.priority-high{border-left-color:#63482d}.priority-high .block-priority{color:#654728;border-color:#b4a38c}
.priority-low .block-priority{color:var(--muted)}
.timeblock small{margin-top:2px;line-height:16px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeblock.density-compact{padding:0 4px;display:flex;flex-direction:column;justify-content:center;align-items:stretch}
.timeblock.density-compact .block-heading,.timeblock.density-compact .block-heading b{line-height:14px;height:14px;font-size:11px}
.timeblock.density-compact .block-priority{font-size:9px;line-height:12px;padding:0 3px}
.timeblock.density-micro{padding:0;border-top:0;border-bottom:0;min-height:0;box-shadow:none}
.timeblock.density-micro:focus-visible{outline-offset:2px}
.timeblock.selected{outline:1px solid #736921;outline-offset:-1px}
.work-priority{display:inline-block;margin-top:6px;font-size:11px;color:var(--muted)}
.short-index{border-top:1px solid var(--line);margin:8px 0 18px;padding-top:10px}
.short-item{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:9px 3px;border-bottom:1px solid var(--line);background:none;text-align:left}
.short-item:hover{background:var(--wash)}.short-kind{font-size:10px;color:var(--muted);flex:none}
.short-item-main{flex:1;min-width:0}.short-item-main strong{font-size:12px;font-weight:500;display:block}.short-item-main small{display:block;font-size:10px;color:var(--muted)}
.timeline-tooltip{position:fixed;z-index:60;pointer-events:none;background:var(--paper);border:1px solid var(--line-dark);box-shadow:0 4px 14px #00000022;border-radius:4px;padding:10px 12px;white-space:pre-line;font:12px/1.7 var(--ui);max-width:min(340px,calc(100vw - 16px));overflow-wrap:anywhere}
.daycell{min-height:55px;gap:5px;padding:8px 2px 14px;flex-wrap:wrap}

.daycell b{padding:0 4px;position:relative;line-height:21px;text-decoration:none!important}
.daycell[aria-pressed=true] b{background:linear-gradient(transparent 38%,var(--accent) 38%,var(--accent) 86%,transparent 86%)}
.daycell .today-caption{font-size:9px;position:absolute;bottom:2px;left:0;right:0;color:var(--muted);line-height:12px}
.daycell .dot{bottom:auto;top:5px;left:auto;right:5px;width:3px;height:3px;opacity:.65}
.calendar-grid>button.current,.calendar-grid>button.selected-date{background:transparent}
.calendar-grid .date-number{display:inline-block;min-width:22px;padding:0 3px;text-align:center}
.calendar-grid>button.selected-date .date-number{background:linear-gradient(transparent 38%,var(--accent) 38%,var(--accent) 86%,transparent 86%)}
.month-today{font-size:9px;color:var(--muted)}
@media(max-width:740px){
 .timeline-scroll{--axis-width:41px}
 .timeblock .block-heading{gap:3px}.timeblock{padding:5px 4px}
 .timeblock .block-heading b{font-size:11px}
 .timeblock.density-compact{padding:0 3px}
 .timeblock .block-priority{font-size:9px;padding:0 2px}
 .daycell{gap:3px;min-height:54px}.daycell .today-caption{font-size:8px}
}

/* 02.2: date entry at the field; optional anchored calendar, continuous clock entry. */
.date-entry{display:flex;align-items:center;border:1px solid #a9a9a9;border-radius:4px;background:var(--paper);overflow:visible;min-width:0}
.date-entry:focus-within{border-color:var(--ink)}
.date-entry input{flex:1;min-width:0;border:0;background:transparent;font-variant-numeric:tabular-nums;font-size:15px;min-height:43px;padding:9px 11px}
.date-entry input[aria-invalid=true]{color:var(--danger)}
.date-entry .date-value{width:42px;flex:none;min-height:42px;padding:8px;display:flex;justify-content:center;border:0;border-left:1px solid var(--line);border-radius:0 4px 4px 0;color:var(--muted)}
.date-entry .date-value:hover{background:var(--wash);color:var(--ink)}
.date-inline-error{font-size:11px;color:var(--danger);margin:0}
.clock-inputs{gap:0;border:1px solid #a9a9a9;border-radius:4px;background:var(--paper);padding-left:8px;min-height:45px}
.clock-inputs>input{width:57px;min-width:0;flex:1;border:0;border-radius:0;background:transparent;font-family:var(--ui);font-size:19px;line-height:24px;font-variant-numeric:tabular-nums;text-align:center;min-height:43px;padding:8px 2px;max-width:none}
.clock-inputs>span{color:var(--muted);font-size:18px;flex:none;padding:0 2px}
.clock-open{display:flex;justify-content:center;align-items:center;flex:none;width:42px;min-height:42px;border-left:1px solid var(--line);background:none;border-radius:0 4px 4px 0;margin-left:6px}
.clock-open:hover{background:var(--wash)}
.date-dialog,.time-dialog{position:fixed;margin:0;width:350px;max-width:calc(100vw - 24px);padding:18px;border:1px solid var(--line-dark);border-radius:6px;box-shadow:0 12px 36px #24242425;max-height:calc(100dvh - 24px);overflow-y:auto}
.date-dialog::backdrop,.time-dialog::backdrop{background:transparent}
.date-dialog-head h2{font-size:20px}.date-dialog-head .iconbtn{border:0;min-height:34px;min-width:34px}
.date-calendar-nav{margin:8px 0}.date-calendar-nav .iconbtn{border:0;min-height:40px;min-width:40px}
.month-jump-trigger{background:none;font-size:15px;font-weight:500;min-height:40px;padding:4px 8px;border-radius:3px}
.month-jump-trigger:hover{background:var(--wash)}
.date-month-jump{display:flex;gap:8px;align-items:flex-end;background:var(--wash);padding:10px;border-radius:4px;margin-bottom:10px}
.date-month-jump label{font-size:11px;flex:1;min-width:0}.date-month-jump input,.date-month-jump select{font-size:14px;min-height:38px;padding:5px 7px}.date-month-jump .btn{min-height:38px}
.calendar-day{height:40px;min-height:40px;padding:0;border:0;background:none}
.calendar-day.is-today{box-shadow:none}.calendar-day.is-today:after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;bottom:4px;background:var(--muted);left:calc(50% - 1.5px)}
.calendar-day{position:relative}.calendar-day .date-number{padding:0 4px;display:inline-block;min-width:25px;line-height:22px;text-decoration:none}
.calendar-day.is-selected{background:transparent;color:var(--ink);border:0}
.calendar-day.is-selected .date-number{background:linear-gradient(transparent 38%,var(--accent) 38%,var(--accent) 86%,transparent 86%)}
.calendar-day:hover{background:var(--wash)}
.date-picker-shortcuts{padding-top:10px;margin-top:10px}.date-direct{margin-top:10px;padding-top:10px}
.picker-time-preview{font:19px/1.7 var(--ui);font-variant-numeric:tabular-nums;padding:8px 0 12px}
.period-tabs{display:flex;border-bottom:1px solid var(--line);gap:8px}
.period-tabs button{background:none;flex:1;font-size:13px;padding:8px 4px;min-height:41px;border-bottom:2px solid transparent}
.period-tabs button[aria-pressed=true]{border-bottom-color:var(--ink);font-weight:600}.period-tabs small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.picker-step{font-size:11px;color:var(--muted);margin:13px 0 6px}
.time-picker-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.time-picker-grid button{background:var(--paper);border:1px solid var(--line);border-radius:3px;min-height:43px;padding:4px 2px;font-size:15px}
.time-picker-grid button small{display:block;font-size:9px;color:var(--muted)}
.time-picker-grid button[aria-pressed=true]{background:var(--wash);border-color:var(--ink);font-weight:650}.time-picker-grid button:hover{border-color:var(--ink)}
.time-picker-grid.minutes button{min-height:38px;font-size:13px}
.picker-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.picker-foot .btn{flex:none}
@media(max-width:740px){
 .date-dialog.picker-sheet,.time-dialog.picker-sheet{width:auto;max-width:none;padding:18px 18px 14px;border-radius:9px;margin:0}
 .date-dialog::backdrop,.time-dialog::backdrop{background:#1e1e1e16}
 .date-entry input{font-size:16px;min-height:46px}.date-entry .date-value,.clock-open{width:44px;min-height:44px}
 .clock-inputs>input{font-size:21px!important;min-height:46px}
 .date-picker-grid .calendar-day{min-height:42px;height:42px}

}

.timeline-meta>.link{flex:none;white-space:nowrap}
.calendar-day.is-today.is-selected:after{display:none}

/* 02.3: independent week overview, calendar without an internal scroll,
   fixed 1-12 hours and one meridiem selection. */
.period-head{margin-bottom:18px}
.period-tools{display:flex;gap:7px;flex-wrap:wrap}
.week-totals{display:flex;gap:0;border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line);padding:14px 0}

.week-totals span{font-size:11px;color:var(--muted)}.week-totals strong{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.week-explanation{font-size:11px;color:var(--muted);margin:10px 0 18px}

.week-today{font-size:9px;color:var(--muted)}
.week-day-totals{margin:0;display:grid;gap:2px;font-size:10px;color:var(--muted)}
.week-day-totals>div{display:flex;justify-content:space-between;gap:4px}.week-day-totals dd{margin:0;text-align:right}
.week-section{border-top:1px solid var(--line);padding-top:9px;min-width:0}
.week-section h3{font-size:11px;font-weight:500;color:var(--muted);margin:0 0 5px}
.week-entry{display:block;width:100%;text-align:left;background:transparent;padding:6px 0;border:0;border-radius:0;min-height:40px}
.week-entry+.week-entry{border-top:1px dotted var(--line)}
.week-entry:hover{background:var(--wash)}.week-entry:focus-visible{outline-offset:2px}
.week-entry-time{display:block;font-size:10px;font-variant-numeric:tabular-nums;color:var(--muted);line-height:1.6}

/* 02.14: titles lead; secondary facts remain readable and wrap on small screens. */

const $=s=>document.querySelector(s);let page='plans',step=0,active=true,plan='',task='',edit='',selected=false,existing=false;const draft={};let period="9월 22일–9월 28일";const escape=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const flow=[['#newplan','여기서 시작','여러 할 일을 묶는 첫 계획. ‘다음’으로 예시 확인.'],['#planform','계획에 이름 붙이기','무엇을 하려는 계획인지 이름 붙이기. 지금은 입력 없이 다음으로.'],['#addtask','구체적인 행동으로','계획 아래에 할 일을 추가하는 곳. 다음 화면에서 예시 확인.'],['#taskform','지금 할 수 있는 행동 하나','실제로 할 행동을 짧고 구체적으로. 예: 책 20쪽 읽기.'],['[data-page="schedule"]','일정에서도 확인','만든 할 일은 일정에도 표시됩니다. 다음으로 일간 화면 확인.'],['#picktask','할 일을 선택하세요','제목을 선택하면 상세가 열립니다. 예정 시간과 기록 시작을 한곳에서 확인.'],['#recordactions','실제로 시작할 때, 여기','계획 배치는 앞으로 할 시간. 기록 시작은 실제로 일하는 시간. 지금 시작할 필요는 없습니다.']];
function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}
function render(){if($('#coach').parentElement!==document.body)document.body.append($('#coach')); $('#nav').innerHTML=['schedule','plans','review','archive'].map((p,i)=>'<button class="navbtn" data-page="'+p+'" '+(p===page?'aria-current="page"':'')+'><span>'+['일정','계획','돌아보기','보관함'][i]+'</span></button>').join('');
let content='';if(page==='plans'){content='<div class="row"><div><div class="eyebrow">PLAN / 할 일을 준비하는 곳</div><h1>계획</h1></div><button class="btn sm" id="newplan">새 계획</button></div>';
if(edit==='plan')content+='<form id="planform"><h2>계획 만들기</h2><label><span class="inklabel" id="plan-title-label">계획 제목</span><input name="plan" required placeholder="예: 이번 주 읽고 쓰기" value="'+escape(draft.plan||'')+'"></label><div class="formgrid"><label>시작일<input type="date" name="start" required value="2026-09-22"></label><label>종료일<input type="date" name="end" required value="2026-09-28"></label></div><label>성공 기준<textarea name="goal" required placeholder="예: 책 한 권을 읽고 생각 정리하기">'+escape(draft.goal||'')+'</textarea></label><div class="formgrid"><label>계획 전체 예상 시간 (분)<input type="number" min="0" value="60"></label><label>우선순위<select><option>보통</option><option>높음</option><option>낮음</option></select></label></div><div class="actions"><button class="btn primary">계획 저장</button></div></form>';
else if(!plan)content+='<section><h2>지금 실제로 하고 있는 일 하나</h2><p class="muted">작은 계획부터 시작할 수 있습니다. 계획을 만든 다음 구체적인 할 일을 추가합니다.</p></section>';
if(plan){content+='<section><small class="muted">진행 중</small><h1>'+escape(plan)+'</h1><p class="muted">'+escape(period)+' · 할 일 0 / '+(task?1:0)+' 완료</p></section><section><div class="row"><h2>할 일</h2><button id="addtask" class="btn primary">할 일 추가</button></div>';
if(edit==='task')content+='<form id="taskform"><label><span class="inklabel" id="task-title-label">할 일 제목</span><input name="task" required placeholder="예: 책 20쪽 읽기" value="'+escape(draft.task||'')+'"></label><label>예상 시간 (분)<input type="number" min="0" value="20"></label><button class="btn primary">할 일 저장</button></form>';
else content+=task?'<p class="taskname">'+escape(task)+'</p><p class="muted">예상 20분 · 미완료</p>':'<p class="muted">계획을 구체적인 할 일로 구분해 보세요.</p>';content+='</section>';}}
if(page==='schedule'){content='<div class="row"><h1>일정</h1><span class="muted">2026년 9월</span></div><nav><button class="navbtn" aria-current="page">일간</button><button class="navbtn" data-preview>주간</button><button class="navbtn" data-preview>월간</button></nav><div class="daystrip">'+['일 20','월 21','화 22','수 23','목 24','금 25','토 26'].map((d,i)=>'<span class="'+(i===2?'today':'')+'">'+d+'</span>').join('')+'</div><section><h2>할 일</h2>'+(task?'<button id="picktask" class="taskdemo"><span class="taskname">'+escape(task)+'</span><small>'+escape(plan)+' · 예상 20분</small></button>':'<p class="muted">계획에서 할 일을 추가해 주세요.</p>')+'</section>';
if(selected)content+='<section id="detail" class="topspace"><p><mark>'+escape(plan)+'</mark></p><h2>'+escape(task)+'</h2><p class="muted">미완료 · 예상 20분</p><div id="recordactions" class="actions"><button class="btn primary" data-preview>기록 시작</button><button class="btn" data-preview>계획 배치</button><button class="btn" data-preview>실행 기록 수기 입력</button></div><p class="muted">예정 시간 · 아직 배치하지 않았습니다.</p><details><summary>실행 기록</summary><p class="muted">아직 실행 기록이 없습니다.</p></details><details><summary>단상</summary><p class="muted">실제로 한 일에 짧은 생각을 남길 수 있습니다.</p></details></section>';}
if(page==='review'||page==='archive')content='<h1>'+ (page==='review'?'돌아보기':'보관함')+'</h1><p class="muted">이번 시안은 첫 계획과 할 일을 만드는 안내 경로를 확인합니다. 이 메뉴의 기능은 기존 서비스에서 유지됩니다.</p><button class="btn" id="resume">안내 이어서 보기</button>';
$('#app').innerHTML=content;wire();showCoach();}
function advance(n){step=n;render();requestAnimationFrame(()=>{const target=guideTarget();target?.scrollIntoView({block:'center',behavior:'smooth'});});}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{const dest=b.dataset.page;if(active&&step===4&&dest==='schedule'){page=dest;advance(5);return;}if(active){active=false;notify('안내를 잠시 멈췄습니다. 사용 안내에서 이어갈 수 있어요.');}page=dest;render();});$('#newplan')?.addEventListener('click',()=>{edit='plan';advance(1)});$('#addtask')?.addEventListener('click',()=>{edit='task';advance(3)});$('#planform')?.addEventListener('input',e=>{if(e.target.name)draft[e.target.name]=e.target.value});$('#taskform')?.addEventListener('input',e=>draft.task=e.target.value);$('#planform')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('end')<f.get('start')){notify('종료일은 시작일 이후로 선택해 주세요.');return;}period=f.get('start')+'–'+f.get('end');plan=f.get('plan').trim();if(!plan)return;edit='';advance(2)});$('#taskform')?.addEventListener('submit',e=>{e.preventDefault();task=new FormData(e.target).get('task').trim();if(!task)return;edit='';advance(4)});$('#picktask')?.addEventListener('click',()=>{selected=true;advance(6)});$('#resume')?.addEventListener('click',resume);document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>notify('안내 위치 검토용입니다. 실제 기록이나 배치는 생성하지 않습니다.'));}
function showCoach(){document.querySelectorAll('.stagefocus').forEach(e=>e.classList.remove('stagefocus'));$('#coach').hidden=!active;$('#spotlight').hidden=!active;if(!active)return;const item=flow[step],target=guideTarget();if(!target){$('#coach').hidden=true;$('#spotlight').hidden=true;return;}target.classList.add('stagefocus');$('#coach').innerHTML='<div class="count">'+(existing?'기존 자료로 시작하기':'첫 할 일 만들기')+' · '+(existing?step-4:step+1)+' / '+(existing?2:7)+'</div><div class="ink-arrow" aria-hidden="true">↖</div><h2>'+item[1]+'</h2><p>'+item[2]+'</p><footer><button class="exit" id="endguide">건너뛰기</button><button class="back" id="prevguide" type="button">이전</button>'+(step===6?'<button class="btn primary" id="finish">안내 마치기</button>':'<button class="btn primary" id="nextguide">다음</button>')+'</footer>';$('#prevguide').disabled=step<=(existing?5:0);$('#prevguide').onclick=()=>{step--;page=step>=5?'schedule':'plans';edit=step===1?'plan':step===3?'task':'';selected=step===6;render();requestAnimationFrame(()=>guideTarget()?.scrollIntoView({block:'center'}));};$('#nextguide')?.addEventListener('click',previewNext);$('#endguide').onclick=()=>{active=false;showCoach();notify('입력한 내용은 유지됩니다. 사용 안내에서 다시 볼 수 있습니다.')};$('#finish')?.addEventListener('click',()=>{active=false;showCoach();notify('안내 완료. 실제 일을 시작할 때 기록 시작을 선택하십시오.')});position();}
function guideTarget(){return $(step===1?'#plan-title-label':step===3?'#task-title-label':step===6?'#recordactions .primary':step===5?'#picktask .taskname':flow[step][0]);}
function position(){if(!active||$('#coach').hidden)return;const t=guideTarget();if(!t)return;const r=t.getBoundingClientRect(),spot=$('#spotlight'),c=$('#coach');Object.assign(spot.style,{left:(r.left-6)+'px',top:(r.top-5)+'px',width:(r.width+12)+'px',height:(r.height+10)+'px'});if(innerWidth<=700){const host=t.closest('form')||t.closest('section')||t.parentElement;if(c.previousElementSibling!==host)host.after(c);return;}if(c.parentElement!==document.body)document.body.append(c);const area=$('#app').getBoundingClientRect();c.style.left=Math.min(innerWidth-286,area.right-310)+'px';c.style.top=(scrollY+r.top-10)+'px';}
function previewNext(){
if(step===0){edit='plan';}
if(step===1){plan='이번 주 읽고 쓰기';edit='';}
if(step===2){edit='task';}
if(step===3){task='책 20쪽 읽기';edit='';}
if(step===4){page='schedule';}
if(step===5){selected=true;}
advance(Math.min(6,step+1));}
function resume(){active=true;page=step>=4?'schedule':'plans';render();requestAnimationFrame(()=>guideTarget()?.scrollIntoView({block:'center'}));}
function reset(){existing=$('#mode').value==='existing';plan=existing?'이번 주 읽고 쓰기':'';task=existing?'책 20쪽 읽기':'';page=existing?'schedule':'plans';step=existing?5:0;active=true;selected=false;edit='';Object.keys(draft).forEach(k=>delete draft[k]);render();}
$('#restart').onclick=reset;$('#mode').onchange=reset;$('#help').onclick=resume;addEventListener('resize',position);addEventListener('scroll',position,{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape'){active=false;showCoach();}});reset();new ResizeObserver(position).observe(document.body);document.fonts.ready.then(position);
</script></html>
