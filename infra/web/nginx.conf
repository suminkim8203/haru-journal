server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ (^|/)\. { return 404; }
    location /_next/static/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
}
